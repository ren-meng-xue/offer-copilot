global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'backend'
    metrics_path: '/metrics'
    static_configs:
      # host.docker.internal 让容器能访问本机 host 上的 backend。
      - targets: ['host.docker.internal:8000']
        labels:
          service: 'offer-copilot-backend'

  - job_name: 'locust'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:9646']
        labels:
          service: 'locust'

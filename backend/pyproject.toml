[project]
name = "offercopilot-api"
version = "0.1.0"
description = "DevDoc RAG API is a developer-documentation RAG backend built with FastAPI, Celery, Redis, PostgreSQL, pgvector, hybrid retrieval, rerank, and citation guard."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.30.0",
    "boto3>=1.42.92",
    "celery>=5.6.3",
    "fastapi>=0.116.1",
    "httpx>=0.28.1",
    "openai>=2.32.0",
    "pgvector>=0.4.2",
    "psycopg2-binary>=2.9.12",
    "psycopg[binary]>=3.3.3",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "pytest>=9.0.3",
    "python-multipart>=0.0.26",
    "redis>=7.4.0",
    "sqlalchemy>=2.0.49",
    "uvicorn[standard]>=0.44.0",
    "email-validator>=2.2.0",
    "bcrypt>=5.0.0",
    "python-jose[cryptography]>=3.3.0",
    "firecrawl-py>=1.15.0",
    "langchain-text-splitters>=0.3.8",
    "celery-types>=0.26.0",
    "cohere>=5.21.1",
    "pymupdf>=1.27.2.3",
    "sentry-sdk>=2.60.0",
    "prometheus-client>=0.25.0",
]

[dependency-groups]
dev = [
    "httpx-sse>=0.4.3",
    "locust>=2.44.0",
    "prometheus-client>=0.25.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
pythonpath = [".."]

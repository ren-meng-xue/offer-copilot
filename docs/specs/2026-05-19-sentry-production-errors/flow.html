<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sentry 生产错误追踪流程</title>
    <style>
      :root {
        --bg: #0f172a;
        --surface: #1e293b;
        --border: #334155;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --action: #3b82f6;
        --success: #10b981;
        --warning: #f59e0b;
        --danger: #ef4444;
        --decision: #8b5cf6;
        --start: #06b6d4;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 20% 20%, rgba(59, 130, 246, 0.14), transparent 28%),
          radial-gradient(circle at 80% 30%, rgba(139, 92, 246, 0.12), transparent 30%),
          linear-gradient(135deg, #020617, var(--bg));
        color: var(--text);
        font-family: Inter, system-ui, sans-serif;
      }

      .wrap {
        width: min(1040px, 94vw);
        padding: 32px 0;
      }

      h1 {
        margin: 0 0 18px;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0;
      }

      svg {
        width: 100%;
        height: auto;
        display: block;
        border: 1px solid rgba(148, 163, 184, 0.22);
        border-radius: 8px;
        background: rgba(15, 23, 42, 0.72);
      }

      .node {
        filter: drop-shadow(0 14px 26px rgba(2, 6, 23, 0.35));
        animation: fadeInUp 0.4s ease both;
      }

      .node text {
        fill: var(--text);
        font-size: 13px;
        font-weight: 650;
        text-anchor: middle;
        dominant-baseline: middle;
      }

      .muted {
        fill: var(--muted);
        font-size: 11px;
        font-weight: 500;
      }

      .edge {
        fill: none;
        stroke: rgba(148, 163, 184, 0.75);
        stroke-width: 2;
        stroke-linecap: round;
        marker-end: url(#arrow);
      }

      .badge {
        fill: rgba(139, 92, 246, 0.18);
        stroke: rgba(139, 92, 246, 0.42);
      }

      .badge-text {
        fill: var(--text);
        font-size: 10px;
        font-weight: 700;
        text-anchor: middle;
        dominant-baseline: middle;
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <h1>Sentry 生产错误追踪流程</h1>
      <svg viewBox="0 0 980 720" role="img" aria-label="Sentry 生产错误追踪流程图">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(148, 163, 184, 0.9)" />
          </marker>
        </defs>

        <path class="edge" d="M490 90 C490 118 490 128 490 154" />
        <path class="edge" d="M490 234 C490 263 490 274 490 302" />
        <path class="edge" d="M490 396 C408 426 336 444 270 478" />
        <path class="edge" d="M490 396 C572 426 644 444 710 478" />
        <path class="edge" d="M270 558 C330 610 405 628 490 642" />
        <path class="edge" d="M710 558 C648 610 574 628 490 642" />

        <g class="node" style="animation-delay: 0ms">
          <circle cx="490" cy="58" r="32" fill="rgba(6, 182, 212, 0.22)" stroke="var(--start)" stroke-width="2" />
          <text x="490" y="58">启动</text>
        </g>

        <g class="node" style="animation-delay: 80ms">
          <rect x="330" y="154" width="320" height="80" rx="8" fill="rgba(59, 130, 246, 0.18)" stroke="var(--action)" stroke-width="2" />
          <text x="490" y="184">读取环境变量</text>
          <text class="muted" x="490" y="207">SENTRY_DSN / ENV / SAMPLE_RATE</text>
        </g>

        <g class="node" style="animation-delay: 160ms">
          <polygon points="490,302 600,350 490,398 380,350" fill="rgba(139, 92, 246, 0.18)" stroke="var(--decision)" stroke-width="2" />
          <text x="490" y="344">是否配置 DSN</text>
          <text class="muted" x="490" y="364">未配置则跳过</text>
        </g>

        <g>
          <rect class="badge" x="326" y="420" width="42" height="24" rx="8" />
          <text class="badge-text" x="347" y="432">否</text>
          <rect class="badge" x="612" y="420" width="42" height="24" rx="8" />
          <text class="badge-text" x="633" y="432">是</text>
        </g>

        <g class="node" style="animation-delay: 240ms">
          <rect x="110" y="478" width="320" height="80" rx="8" fill="rgba(245, 158, 11, 0.16)" stroke="var(--warning)" stroke-width="2" />
          <text x="270" y="508">本地/测试不初始化</text>
          <text class="muted" x="270" y="531">避免污染 Sentry 项目</text>
        </g>

        <g class="node" style="animation-delay: 320ms">
          <rect x="550" y="478" width="320" height="80" rx="8" fill="rgba(16, 185, 129, 0.16)" stroke="var(--success)" stroke-width="2" />
          <text x="710" y="508">初始化 Sentry</text>
          <text class="muted" x="710" y="531">FastAPI / Starlette 集成</text>
        </g>

        <g class="node" style="animation-delay: 400ms">
          <circle cx="490" cy="664" r="42" fill="rgba(16, 185, 129, 0.2)" stroke="var(--success)" stroke-width="2" />
          <text x="490" y="657">异常进入</text>
          <text x="490" y="676">Issues</text>
        </g>
      </svg>
    </main>
  </body>
</html>
